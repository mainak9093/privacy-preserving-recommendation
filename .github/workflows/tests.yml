# What a reader of this repository can check without building anything: every push
# builds the code, runs the tests in the normal and hardened builds, redraws every figure
# from the committed rows, and rechecks the numbers the documents state.
#
# MovieLens-100K is fetched here, not redistributed. Without it the PIR, catalogue and
# serving tests skip their real-data parts, so a run without it would prove much less.
name: tests

on:
  push:
  pull_request:

jobs:
  build-and-test:
    name: Build, test and demo
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/cache@v4
        with:
          path: data/ml-100k
          key: movielens-ml-100k-v1
      - name: Fetch MovieLens-100K (checksum-verified) and export the cleartext model
        shell: pwsh
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python -m pip install --quiet numpy
          python scripts/fetch_data.py ml-100k
          python model/export.py
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: mingw-w64-x86_64-gcc mingw-w64-x86_64-make git
      - name: Build and run all test binaries
        shell: msys2 {0}
        run: mingw32-make test
      - name: Run the private-delivery demo end to end
        shell: msys2 {0}
        run: |
          mingw32-make apps
          ./build/demo.exe --user 42 --k 10

  hardened:
    name: Hardened build (UBSan traps, checked iterators, checked spans)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: mingw-w64-x86_64-gcc mingw-w64-x86_64-make git
      - name: Run all test binaries under the hardened build
        shell: msys2 {0}
        run: mingw32-make check

  numbers:
    name: Figures and stated numbers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/cache@v4
        with:
          path: data/ml-100k
          key: movielens-ml-100k-v1
      - name: Install the plotting dependencies and fetch MovieLens-100K
        run: |
          python -m pip install --quiet numpy matplotlib
          python scripts/fetch_data.py ml-100k
      - name: Redraw all 12 figures from the committed rows
        run: python bench/scripts/make_figures.py
      - name: Check every stated number against the data
        run: python bench/scripts/check_claims.py --deck report/slides/OblivRec_final_presentation.pptx
